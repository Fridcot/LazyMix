name: Bug report
description: Behavior differs from what is documented or intended.
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Link the documentation or decision that says so, if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
