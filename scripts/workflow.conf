# Project-specific settings for the workflow scripts. Sourced by scripts/lib/workflow.sh.
# Every script, every local gate and every CI job reads this one file, so a path list
# is declared here once and never copied into a workflow.
#
# Path patterns: a pattern ending in "/" is a directory prefix, a pattern containing
# "*" or "?" is a shell glob ("*" also matches "/"), anything else is an exact path.

# ---------------------------------------------------------------------------------
# Repository
# ---------------------------------------------------------------------------------

# The branch every change merges into. The gates refuse to run on it.
WF_BASE_BRANCH=main

# owner/name of the canonical repository. Used to find the base remote by URL rather
# than by remote name (so a fork with an `upstream` remote resolves correctly).
# Empty means "use origin".
WF_BASE_REPOSITORY="Fridcot/LazyMix"

# Prefix for branches created by agents.
WF_AGENT_BRANCH_PREFIX="agent/"

# ---------------------------------------------------------------------------------
# .NET stack (leave WF_DOTNET_SOLUTION empty to disable)
# ---------------------------------------------------------------------------------

WF_DOTNET_SOLUTION="LazyMix.slnx"

# Paths whose change runs the .NET flow.
WF_DOTNET_PATHS=(
  src/
  tests/
  "*.slnx"
  "*.sln"
  global.json
  NuGet.config
  nuget.config
  .editorconfig
  .config/dotnet-tools.json
  "*.props"
  "*.targets"
)

# Paths under WF_DOTNET_PATHS that belong to another stack instead.
WF_DOTNET_EXCLUDE=(
  src/web/
)

# Paths whose change runs every configured stack: the gates and the CI definition
# themselves, so a pull request that breaks them cannot pass with the stack jobs skipped.
WF_ALL_STACKS_PATHS=(
  scripts/
  .github/workflows/ci.yml
)

# A change to one of these can affect every project, so the fast loop runs every unit
# suite instead of the narrowed set.
WF_SHARED_BUILD_INPUTS=(
  "*.slnx"
  "*.sln"
  global.json
  NuGet.config
  nuget.config
  .editorconfig
  "*.props"
  "*.targets"
  "*packages.lock.json"
)

# Unit test projects: fast, isolated, no Docker. The fast loop runs the ones a change
# can have broken. Globs relative to the repository root.
WF_UNIT_TEST_PROJECTS=(
  "tests/*.UnitTests/*.csproj"
)

# Whether the full gate and CI also run every other test project in the solution
# (integration tests, Aspire AppHost tests needing Docker).
WF_FULL_RUNS_ALL_TESTS=true

# Directories searched for tests that reference a changed type (review-obligations).
WF_TEST_ROOTS=(
  tests/
)

# ---------------------------------------------------------------------------------
# Frontend stack (leave WF_FRONTEND_DIR empty to disable)
# ---------------------------------------------------------------------------------

WF_FRONTEND_DIR="src/web"

# npm or pnpm.
WF_FRONTEND_PM=npm

# Paths whose change runs the frontend flow. Defaults to "$WF_FRONTEND_DIR/".
WF_FRONTEND_PATHS=()

# package.json scripts run by each gate. A script the package does not define is
# reported as skipped, not failed. "format" (repairing) runs in the fast loop and
# "format:check" in the full gate and CI, when defined.
WF_FRONTEND_FAST_SCRIPTS=(lint typecheck test)
WF_FRONTEND_FULL_SCRIPTS=(lint typecheck test build)

# ---------------------------------------------------------------------------------
# Custom stack (leave WF_CUSTOM_COMMANDS empty to disable)
# ---------------------------------------------------------------------------------

# Paths whose change runs the custom stack, and the commands it runs (each through
# `bash -c` from the repository root, in the fast gate, the full gate and CI alike).
# For example a shell or Python suite, or infrastructure checks.
WF_CUSTOM_PATHS=()
WF_CUSTOM_COMMANDS=()

# ---------------------------------------------------------------------------------
# Documentation and obligations
# ---------------------------------------------------------------------------------

# Every Markdown page under these directories carries a `<!-- describes: ... -->`
# marker within its first 15 lines (see docs/AGENTS.md).
WF_DOCS_ROOTS=(
  docs/
)

# Registers a change obliges: "<pattern>=><file>". When a changed path matches the
# pattern, review-obligations reports whether <file> was touched too.
# LazyMix keeps no notices register yet; vendored agent skills are attributed in
# .claude/skills/README.md.
WF_REGISTER_RULES=(
  ".claude/skills/aspire*=>.claude/skills/README.md"
  ".claude/skills/dotnet-inspect/*=>.claude/skills/README.md"
)

# ---------------------------------------------------------------------------------
# Governance
# ---------------------------------------------------------------------------------

# Paths only a repository admin may change in a pull request: the rules that judge a
# change cannot be rewritten by the same change.
WF_PROTECTED_PATHS=(
  .github/
  .agents/
  .claude/
  docs/decisions/
  scripts/
  AGENTS.md
  "*/AGENTS.md"
  CLAUDE.md
  "*/CLAUDE.md"
  .editorconfig
  .worktreeinclude
  global.json
  NuGet.config
  nuget.config
  .mcp.json
  "Directory.Build.props"
  src/web/eslint.config.js
  "src/web/tsconfig*.json"
)

# Owners of GitHub Actions a workflow may use (`uses: <owner>/...`).
WF_ALLOWED_ACTION_OWNERS=(actions github anthropics)

# Workflows allowed to use `pull_request_target` (they run with secrets on fork PRs and
# must never check out the head).
WF_PULL_REQUEST_TARGET_WORKFLOWS=(ai-review.yml)

# Repositories /retro reads evidence from (scripts/collect-retro-evidence.sh), as
# "owner/name" or "owner/name=<local checkout>" when its gate log should be read too
# (a relative checkout is taken from this repository's root; "~/" is the home
# directory). Empty means this repository and this checkout.
WF_RETRO_REPOSITORIES=()

# Paths the AI review never reads (generated or vendored code).
WF_REVIEW_EXCLUDE=(
  "*/Migrations/*"
  "*.Designer.cs"
  "*package-lock.json"
  "*pnpm-lock.yaml"
  "*packages.lock.json"
  ".claude/skills/aspire*"
  ".claude/skills/dotnet-inspect/*"
)
